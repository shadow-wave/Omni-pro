            justify-content: center !important;

    <script>
        // ==========================================
        // SERVICE WORKER REGISTRATION (OFFLINE SUPPORT)
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered (Offline Ready)', reg))
                    .catch(err => console.error('Service Worker Registration Failed:', err));
            });
        }

        // PWA Install Prompt Listener
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const pwaBtn = document.getElementById('pwa-install-btn');
            pwaBtn.classList.remove('hidden');
            pwaBtn.addEventListener('click', async () => {
                pwaBtn.classList.add('hidden');
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            });
        });

        // ==========================================
        // PLOT SNATCHER (CLEAN CONTAINER INJECTION)
        // ==========================================
        const plotSnatcher = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
                for (const node of mutation.addedNodes) {
                    if (node.id && (node.id.startsWith('matplotlib') || node.tagName === 'CANVAS')) {
                        const target = document.getElementById('plot-target');
                        if (target && !target.contains(node)) {
                            target.innerHTML = ''; 
                            target.appendChild(node);
                        }
                    }
                }
            }
        });
        plotSnatcher.observe(document.body, { childList: true });

        let pyodide = null, micropip = null, completedLabs = new Set();
        const outputElement = document.getElementById("output"), 
              statusText = document.getElementById("status-text"), 
              statusInd = document.getElementById("status-indicator"), 
              runBtn = document.getElementById("run-btn");

        // Code Editor Setup
        const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), { 
            mode: { name: "python", version: 3 }, 
            theme: "nord", 
            lineNumbers: true, 
            indentUnit: 4, 
            autoCloseBrackets: true, 
            styleActiveLine: true, 
            lineWrapping: true,
            inputStyle: "contenteditable", 
            spellcheck: false,
            autocorrect: false,
            autocapitalize: false
        });

        // Continuous backspace fix
        editor.on("keydown", function(cm, e) {
            if (e.keyCode === 8 || e.key === "Backspace") {
                const cursor = cm.getCursor();
                if (cursor.ch === 0 && cursor.line > 0) {
                    e.preventDefault();
                    cm.execCommand("delCharBefore");
                }
            }
        });

        const defaultCode = `# Omni-Studio | Python Lab Environment\nprint(">>> System Online. Type your Python script below:")`;
        const savedCode = localStorage.getItem("omni_pro_v5");
        editor.setValue(savedCode || defaultCode);
        editor.on("change", () => localStorage.setItem("omni_pro_v5", editor.getValue()));

        window.addEventListener('DOMContentLoaded', () => {
            initPyodide(); 
        });

        // ==========================================
        // PYODIDE INITIALIZATION & ENGINE MOUNT
        // ==========================================
        async function initPyodide() {
            const bootBtn = document.getElementById("boot-btn");
            const bootStatus = document.getElementById("boot-status");
            const bootIcon = document.getElementById("boot-icon");
            const bootText = document.getElementById("boot-text");

            try {
                if (bootStatus) bootStatus.innerText = "Loading WebAssembly Engine...";
                pyodide = await loadPyodide();
                
                if (bootStatus) bootStatus.innerText = "Mounting NumPy & Matplotlib...";
                await pyodide.loadPackage(["micropip", "numpy", "matplotlib"]);
                micropip = pyodide.pyimport("micropip");
                
                if (bootStatus) bootStatus.innerText = "Configuring I/O Virtual System...";
                await pyodide.runPythonAsync(`
import builtins
import sys
from js import prompt

def custom_input(p=""):
    val = prompt(p)
    if val is None:
        val = ""
    print(f"{p}{val}")
    return val

builtins.input = custom_input
`);
                pyodide.setStdout({ batched: (msg) => log(msg) });
                
                // Configure Matplotlib Backend globally
                await pyodide.runPythonAsync(`
import matplotlib
import matplotlib.pyplot as plt
matplotlib.use("module://matplotlib_pyodide.html5_canvas_backend")
plt.rcParams['figure.autolayout'] = True
`);

                statusInd.className = "w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]";
                statusText.innerText = "Engine Ready"; 
                statusText.classList.replace("text-gray-400", "text-green-400");
                runBtn.disabled = false; 
                document.getElementById("mem-usage").classList.remove("hidden");
                
                refreshFileList(); 
                loadProgress();

                if (bootIcon) bootIcon.className = "fa-solid fa-circle-check text-green-400";
                if (bootText) bootText.innerText = "System Ready";
                if (bootStatus) bootStatus.innerText = "Entering Studio...";
                
                setTimeout(enterStudio, 600);

            } catch (err) { 
                console.error(err);
                statusInd.className = "w-2 h-2 rounded-full bg-red-500"; 
                statusText.innerText = "Offline Error";
                if (bootIcon) bootIcon.className = "fa-solid fa-triangle-exclamation text-red-500";
                if (bootText) bootText.innerText = "Kernel Failed";
                if (bootStatus) bootStatus.innerText = "Verify file permissions or reload.";
                setTimeout(enterStudio, 1500);
            }
        }

        // ==========================================
        // EXECUTION ENGINE & ERROR FORMATTER
        // ==========================================
        function handlePythonError(err) {
            const errStr = err.toString();
            let lineNum = "Unknown";
            const lineMatch = errStr.match(/File "<exec>", line (\d+)/);
            if (lineMatch) lineNum = lineMatch[1];
            
            const lines = errStr.split('\n').filter(l => l.trim().length > 0);
            let errMsg = lines[lines.length - 1].replace("PythonError: ", "").trim();
            
            let tip = "Review syntax or variable definitions.";
            if (errMsg.includes("NameError")) tip = "Variable or function used without being declared.";
            else if (errMsg.includes("SyntaxError")) tip = "Check missing colons (:), brackets, or quotes.";
            else if (errMsg.includes("TypeError")) tip = "Mismatched data types in operation.";
            else if (errMsg.includes("IndentationError")) tip = "Ensure uniform spaces/tabs.";
            else if (errMsg.includes("IndexError")) tip = "List index out of bounds.";
            else if (errMsg.includes("FileNotFoundError")) tip = "File not created or mounted in memory.";
            
            const formattedError = `❌ Execution Error (Line ${lineNum})\n↳ ${errMsg}\n\n💡 Tip: ${tip}`;
            log(formattedError, "text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl mt-2 mb-2 font-mono text-[11px] leading-relaxed");
        }

        async function runCode() {
            const code = editor.getValue();
            if (!code.trim() || !pyodide) return;
            
            runBtn.disabled = true;
            document.getElementById("mem-bar").style.width = "90%";
            
            const isPlotCode = code.includes("matplotlib") || code.includes("plt.");
            if (isPlotCode) switchTab('plots'); else switchTab('terminal');

            try {
                if (isPlotCode) {
                    preparePlots();
                    window.document.pyodideMplTarget = document.getElementById("plot-target");
                    await pyodide.runPythonAsync(`plt.close('all')`);
                }
                await pyodide.runPythonAsync(code);
                checkLabCompletion(code);
            } catch (err) { 
                handlePythonError(err);
            } finally { 
                runBtn.disabled = false; 
                document.getElementById("mem-bar").style.width = "25%"; 
            }
        }

        async function installDataScience() {
            if (!micropip) return;
            const bar = document.getElementById("ds-status").firstElementChild;
            bar.style.width = "50%";
            switchTab('terminal');
            log("Loading SciPy and Math packages...", "text-indigo-400");
            try {
                await micropip.install(['scipy', 'sympy']);
                bar.style.width = "100%";
                bar.classList.replace("bg-indigo-500", "bg-green-400");
                log("Scientific Suite Ready!", "text-green-400");
            } catch (e) {
                bar.style.width = "0%";
                log("SciPack Error: " + e, "text-red-400");
            }
        }

        document.getElementById("pip-input").addEventListener("keypress", async function(e) {
            if (e.key === "Enter") {
                const pkg = this.value.trim();
                if (!pkg || !micropip) return;
                this.value = "";
                switchTab('terminal');
                log(`Fetching package '${pkg}'...`, "text-indigo-400");
                try {
                    await micropip.install(pkg);
                    log(`Package '${pkg}' installed successfully!`, "text-green-400");
                } catch(err) {
                    log(`Package error: ${err}`, "text-red-400");
                }
            }
        });

        // UI Helpers
        function enterStudio() { 
            const s = document.getElementById('splash-screen'); 
            s.style.opacity = '0'; 
            setTimeout(() => { s.style.display = 'none'; editor.refresh(); }, 650); 
        }

        function switchTab(id) { 
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); 
            document.getElementById(`tab-${id}`).classList.add('active'); 
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.target === id)); 
            if (id === 'editor') setTimeout(() => editor.refresh(), 50); 
        }

        function log(msg, cls="text-emerald-400") { 
            const d = document.createElement("div"); 
            d.className = cls + " mb-1"; 
            d.innerText = msg; 
            outputElement.appendChild(d); 
            outputElement.scrollTop = outputElement.scrollHeight; 
        }

        function clearTerminal() { outputElement.innerHTML = ""; }
        function clearEditor() { if (confirm("Clear code editor?")) editor.setValue("# New Script\n"); }
        function insert(t) { 
            const d = editor.getDoc(), c = d.getCursor(); 
            d.replaceRange(t, c); 
            if (t.includes('()') || t.includes('[]') || t.includes('{}') || t.includes('\'\'')) {
                d.setCursor({line: c.line, ch: c.ch + 1});
            }
            editor.focus(); 
        }
        
        function backspaceCode() { editor.execCommand("delCharBefore"); editor.focus(); }

        function preparePlots() { 
            const placeholder = document.getElementById("plot-placeholder");
            if (placeholder) placeholder.style.display = 'none'; 
            document.getElementById("btn-download-plot").classList.remove("hidden"); 
        }

        function clearPlots() { 
            document.getElementById("plot-target").innerHTML = `<div id="plot-placeholder" class="text-center opacity-20"><i class="fa-solid fa-chart-pie text-6xl mb-3 text-indigo-300"></i><p class="text-[11px] font-mono uppercase tracking-wider">No Graph Generated</p></div>`; 
            document.getElementById("btn-download-plot").classList.add("hidden"); 
        }

        function downloadPlot() { 
            const c = document.querySelector("#plot-target canvas"); 
            if (c) { 
                const a = document.createElement('a'); 
                a.download = 'OmniPlot.png'; 
                a.href = c.toDataURL(); 
                a.click(); 
            } 
        }

        // ==========================================
        // UNIVERSITY LAB SYLLABUS DATA[cite: 1]
        // ==========================================
        const snippets = {
            lab_1: `# 1. Triangle Area[cite: 1]\nbase = float(input("Enter base: "))\nheight = float(input("Enter height: "))\narea = 0.5 * base * height\nprint(f"Area of triangle = {area}")`,
            
            lab_2: `# 2. Largest Number in List[cite: 1]\nnumbers = [14, 58, 2, 99, 31, 7]\nlargest = max(numbers)\nprint(f"List: {numbers}")\nprint(f"Largest Number: {largest}")`,
            
            lab_3: `# 3. Sort Dictionary by Value[cite: 1]\nmy_dict = {'apple': 50, 'banana': 20, 'cherry': 85, 'date': 15}\nasc = dict(sorted(my_dict.items(), key=lambda item: item[1]))\ndesc = dict(sorted(my_dict.items(), key=lambda item: item[1], reverse=True))\nprint(f"Ascending: {asc}")\nprint(f"Descending: {desc}")`,
            
            lab_4: `# 4. Create and Display Sets[cite: 1]\nset_a = {1, 2, 3, 4, 5}\nset_b = set([5, 6, 7, 8, 9])\nprint(f"Set A: {set_a}")\nprint(f"Set B: {set_b}")`,
            
            lab_5: `# 5. Union of Two Sets[cite: 1]\nset_1 = {1, 2, 3, 4}\nset_2 = {3, 4, 5, 6}\nunion_result = set_1 | set_2\nprint(f"Set 1: {set_1}")\nprint(f"Set 2: {set_2}")\nprint(f"Union Set: {union_result}")`,
            
            lab_6: `# 6. Read CSV Data into List[cite: 1]\nimport csv\n\n# Creating virtual data.csv[cite: 1]\nwith open('data.csv', 'w') as f:\n    f.write("Name,Score\\nAlice,95\\nBob,88\\nCharlie,92")\n\nwith open('data.csv', 'r') as file:\n    reader = csv.reader(file)\n    records = list(reader)\n    print("CSV Content List:")\n    print(records)`,
            
            lab_7: `# 7. Matplotlib Bar Chart[cite: 1]\nimport matplotlib.pyplot as plt\n\nlanguages = ['Java', 'Python', 'PHP', 'JavaScript', 'C#', 'C++']\npopularity = [22.2, 17.6, 8.8, 8.0, 7.7, 6.7]\n\nplt.figure(figsize=(7, 4.5))\nplt.bar(languages, popularity, color='#6366f1')\nplt.xlabel('Programming Languages')\nplt.ylabel('Popularity (%)')\nplt.title('Language Popularity Index')\nplt.grid(axis='y', linestyle='--', alpha=0.3)\nplt.tight_layout()\nplt.show()`,
            
            lab_8: `# 8. Olympic Medals Pie Chart[cite: 1]\nimport csv\nimport matplotlib.pyplot as plt\n\nwith open('medals.csv', 'w') as f:\n    f.write("Country,Gold\\nUSA,46\\nGBR,27\\nChina,26\\nRussia,19")\n\ncountries = []\nmedals = []\n\nwith open('medals.csv', 'r') as file:\n    reader = csv.reader(file)\n    next(reader)\n    for row in reader:\n        countries.append(row[0])\n        medals.append(int(row[1]))\n\nplt.figure(figsize=(6, 6))\nplt.pie(medals, labels=countries, autopct='%1.1f%%', startangle=140, colors=['#6366f1', '#a855f7', '#ec4899', '#3b82f6'])\nplt.title('Gold Medal Achievements')\nplt.axis('equal')\nplt.show()`
        };

        function loadSnippet(k) { 
            if (confirm("Load this lab snippet into the editor?")) { 
                editor.setValue(snippets[k]); 
                switchTab('editor'); 
            } 
        }

        function checkLabCompletion(code) { 
            for (let k in snippets) {
                if (code.trim() === snippets[k].trim()) markLabDone(k); 
            }
        }

        function markLabDone(k) { 
            completedLabs.add(k); 
            const btn = document.getElementById(`${k}_btn`); 
            if (btn) btn.classList.add("completed-lab"); 
            saveProgress(); 
            updateProgressUI(); 
        }

        function updateProgressUI() { 
            const total = 8;
            const percent = Math.round((completedLabs.size / total) * 100); 
            if (document.getElementById("progress-percent")) document.getElementById("progress-percent").innerText = `${percent}%`; 
            if (document.getElementById("progress-bar")) document.getElementById("progress-bar").style.width = `${percent}%`; 
        }

        function saveProgress() { localStorage.setItem("omni_progress_v5", JSON.stringify([...completedLabs])); }
        
        function loadProgress() { 
            const data = localStorage.getItem("omni_progress_v5"); 
            if (data) { 
                const arr = JSON.parse(data); 
                arr.forEach(k => { 
                    completedLabs.add(k); 
                    const btn = document.getElementById(`${k}_btn`); 
                    if (btn) btn.classList.add("completed-lab"); 
                }); 
                updateProgressUI(); 
            } 
        }

        // Local Storage File Manager[cite: 1]
        function saveFile() { 
            const n = document.getElementById("filename-input").value.trim(); 
            if (!n) return; 
            const s = JSON.parse(localStorage.getItem("omni_local_v5") || "{}"); 
            s[n] = editor.getValue(); 
            localStorage.setItem("omni_local_v5", JSON.stringify(s)); 
            document.getElementById("filename-input").value = "";
            refreshFileList(); 
        }

        function refreshFileList() { 
            const l = document.getElementById("file-list"); 
            l.innerHTML = ""; 
            const s = JSON.parse(localStorage.getItem("omni_local_v5") || "{}"); 
            Object.keys(s).forEach(k => { 
                const d = document.createElement("div"); 
                d.className = "flex justify-between items-center p-3 rounded-xl bg-white/5 border border-white/5"; 
                d.innerHTML = `<span class="text-[11px] text-white font-mono">${k}</span>
                    <div class="flex gap-3">
                        <button onclick="loadFile('${k}')" class="text-indigo-400 hover:text-indigo-300"><i class="fa-solid fa-folder-open"></i></button>
                        <button onclick="deleteFile('${k}')" class="text-red-400/60 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
                    </div>`; 
                l.appendChild(d); 
            }); 
        }

        function loadFile(k) {
            const s = JSON.parse(localStorage.getItem('omni_local_v5') || "{}");
            if (s[k]) {
                editor.setValue(s[k]);
                switchTab('editor');
            }
        }

        function deleteFile(k) { 
            if (confirm(`Delete file "${k}"?`)) { 
                const x = JSON.parse(localStorage.getItem('omni_local_v5') || "{}"); 
                delete x[k]; 
                localStorage.setItem('omni_local_v5', JSON.stringify(x)); 
                refreshFileList(); 
            } 
        }
    </script>
